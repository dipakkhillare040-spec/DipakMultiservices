<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Schemes</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f5f5f5;
}

header{
    background:#0057d9;
    color:white;
    padding:20px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

.scheme-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
    padding:40px;
}

.scheme-card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    transition:0.3s;
}

.scheme-card:hover{
    transform:translateY(-5px);
}

.scheme-card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.scheme-card h2{
    padding:15px 15px 5px;
}

.scheme-card p{
    padding:0 15px 20px;
    color:#555;
}

</style>
</head>

<body>

<header>
Student Government Schemes
</header>

<div class="scheme-container">

<div class="scheme-card">
<img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644">
<h2>Scholarship Scheme</h2>
<p>Government scholarship for college students.</p>
</div>

<div class="scheme-card">
<img src="https://images.unsplash.com/photo-1513258496099-48168024aec0">
<h2>Free Laptop Scheme</h2>
<p>Eligible students get free laptops.</p>
</div>

<div class="scheme-card">
<img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f">
<h2>Hostel Assistance</h2>
<p>Financial support for hostel students.</p>
</div>

<div class="scheme-card">
<img src="https://images.unsplash.com/photo-1524995997946-a1c2e315a42f">
<h2>Education Loan Scheme</h2>
<p>Low interest education loan support.</p>
</div>

</div>

</body>
</html>
